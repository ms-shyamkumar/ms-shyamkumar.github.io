<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Insights</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
		<div class="menu-bar", id="menu-bar">
			<div class="menu-items">
				<a href="index.html" class="active">Insights</a>
				<a href="about.html">About</a>
			</div>
        </div>
        <div class="subtitle"><b>Data Driven Insights and Analytics</b></div>
        
        <div class="content-wrapper">
            <div class="sidebar" id="sidebar">
                <button class="toggle-sidebar" onclick="toggleSidebar()">☰</button>
                <div class="sidebar-content">
                    <input type="text" id="search" placeholder="Search contents..." oninput="filterItems()">
                    <div id="categories"></div>
                </div>
            </div>
            
            <div class="main-content">
                <div class="sort-options">
                    <select id="sort" onchange="sortItems()">
                        <option value="date">Sort by Date</option>
                        <option value="title">Sort Alphabetically</option>
                    </select>
                </div>
                <div id="content-list"></div>
            </div>
        </div>
        
        <div class="modal" id="content-modal">
		<span class="close" onclick="closeModal()">&times;</span>
            <div class="modal-content">             
                <iframe id="content-frame" frameborder="0"></iframe>
            </div>
        </div>
        
        <footer>
            © 2025 All rights reserved.
        </footer>
    </div>
    
    <script src="scripts.js"></script>
</body>
</html>
